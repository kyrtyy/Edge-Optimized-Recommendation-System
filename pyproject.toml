[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "build", "dist", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle errors + pyflakes + isort
ignore = [
    "E501",   # line too long (handled by formatter)
    "F401",   # unused imports in __init__.py
]
